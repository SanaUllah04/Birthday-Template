<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #050b12;
        --bg-teal: #0e2530;
        --bg-teal-2: #16333f;
        --gold: #e8c27a;
        --gold-bright: #f6dfa8;
        --ivory: #f2efe6;
        --lavender: #d8dce6;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background: var(--bg-deep);
        font-family: "Cormorant Garamond", serif;
        overflow-x: hidden;
      }

      .stage {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at 20% 15%,
            rgba(232, 194, 122, 0.1),
            transparent 45%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(232, 194, 122, 0.08),
            transparent 40%
          ),
          linear-gradient(
            180deg,
            var(--bg-teal) 0%,
            var(--bg-teal-2) 35%,
            #08131a 75%,
            #020507 100%
          );
      }

      /* subtle vignette */
      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center 40%,
          transparent 40%,
          rgba(0, 0, 0, 0.55) 100%
        );
        pointer-events: none;
        z-index: 5;
      }

      canvas#sparkles {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .content {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 6vh 5vw 8vh;
        width: 100%;
        max-width: 900px;
      }

      /* photo cutout */
      .portrait-wrap {
        position: relative;
        width: min(46vw, 420px);
        aspect-ratio: 3/4;
        margin-bottom: 2.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brush-glow {
        position: absolute;
        inset: -6%;
        background: radial-gradient(
          ellipse at center,
          rgba(200, 210, 215, 0.16) 0%,
          rgba(200, 210, 215, 0.07) 45%,
          transparent 72%
        );
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><path d='M70 40 C40 90 55 140 35 190 C15 240 45 300 30 350 C18 400 60 440 120 460 C190 485 260 470 310 430 C365 385 375 320 360 260 C348 210 375 165 350 110 C325 55 260 15 190 20 C140 24 100 5 70 40 Z'/></svg>");
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><path d='M70 40 C40 90 55 140 35 190 C15 240 45 300 30 350 C18 400 60 440 120 460 C190 485 260 470 310 430 C365 385 375 320 360 260 C348 210 375 165 350 110 C325 55 260 15 190 20 C140 24 100 5 70 40 Z'/></svg>");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }

      .portrait {
        position: relative;
        width: 78%;
        height: 88%;
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><path d='M70 40 C40 90 55 140 35 190 C15 240 45 300 30 350 C18 400 60 440 120 460 C190 485 260 470 310 430 C365 385 375 320 360 260 C348 210 375 165 350 110 C325 55 260 15 190 20 C140 24 100 5 70 40 Z'/></svg>");
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><path d='M70 40 C40 90 55 140 35 190 C15 240 45 300 30 350 C18 400 60 440 120 460 C190 485 260 470 310 430 C365 385 375 320 360 260 C348 210 375 165 350 110 C325 55 260 15 190 20 C140 24 100 5 70 40 Z'/></svg>");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        background-size: cover;
        background-position: center 20%;
        background-image: url("eyes.jpeg");
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .portrait .placeholder-label {
        font-family: "Cormorant Garamond", serif;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        color: rgba(232, 194, 122, 0.55);
        border: 1px dashed rgba(232, 194, 122, 0.4);
        padding: 0.5rem 1rem;
        border-radius: 4px;
      }

      .eyebrow {
        font-family: "Great Vibes", cursive;
        font-size: clamp(2.1rem, 4.5vw, 3.4rem);
        color: var(--ivory);
        letter-spacing: 0.01em;
        line-height: 1;
        margin-bottom: 0.6rem;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
      }

      .name {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: clamp(2.4rem, 7vw, 4.6rem);
        letter-spacing: 0.06em;
        color: var(--lavender);
        text-transform: uppercase;
        line-height: 1.05;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #cfd6e2 55%,
          #9ba4b4 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.55));
      }

      .divider {
        width: 60px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        margin: 1.6rem 0;
        opacity: 0.7;
      }

      .sub {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(0.95rem, 1.4vw, 1.15rem);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(216, 220, 230, 0.65);
      }

      @media (max-width: 640px) {
        .portrait-wrap {
          width: 62vw;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="sparkles"></canvas>

      <div class="content">
        <div class="portrait-wrap">
          <div class="brush-glow"></div>
          <div class="portrait"></div>
        </div>

        <div class="eyebrow">Happy Birthday</div>
        <div class="name">Irsa&nbsp;Noman</div>
        <div class="divider"></div>
        <div class="sub">Wishing you a beautiful year ahead</div>
      </div>
    </div>

    <script>
      // Ambient gold sparkle / bokeh field
      const canvas = document.getElementById("sparkles");
      const ctx = canvas.getContext("2d");
      let w, h, particles;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        initParticles();
      }

      function initParticles() {
        const count = Math.floor((w * h) / 14000);
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2.2 + 0.4,
          baseAlpha: Math.random() * 0.6 + 0.15,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.4 + 0.15,
          drift: (Math.random() - 0.5) * 0.15,
          big: Math.random() < 0.06,
        }));
      }

      function draw(time) {
        ctx.clearRect(0, 0, w, h);
        particles.forEach((p) => {
          const twinkle =
            Math.sin(time * 0.001 * p.speed + p.phase) * 0.5 + 0.5;
          const alpha = p.baseAlpha * twinkle;
          const radius = p.big ? p.r * 5 : p.r;

          if (p.big) {
            const grad = ctx.createRadialGradient(
              p.x,
              p.y,
              0,
              p.x,
              p.y,
              radius * 4,
            );
            grad.addColorStop(0, `rgba(246,223,168,${alpha * 0.5})`);
            grad.addColorStop(1, "rgba(246,223,168,0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius * 4, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.beginPath();
          ctx.fillStyle = `rgba(246,223,168,${alpha})`;
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fill();

          p.y -= p.speed * 2;
          p.x += p.drift;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;
        });
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
